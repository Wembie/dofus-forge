<!--
  Dofus Forge — plantilla de correo "Reauthentication"
  Pega esto en: Supabase Dashboard → Authentication → Email Templates → Reauthentication
  (modo HTML/source, no el editor visual)

  Supabase solo permite UN template por tipo (no hay variante por idioma
  nativa) — se dejó en inglés como idioma universal, igual que confirm-signup.html.
  Para mandar el idioma correcto por usuario hace falta un Auth Hook (Edge
  Function) interceptando el envío — tarea aparte.

  Este template NO tiene link de confirmación — Supabase solo expone un
  código OTP ({{ .Token }}) que el usuario tipea en la app para confirmar
  una acción sensible (ej. borrar cuenta, cambiar email).
  Variables disponibles de Supabase: {{ .Token }} {{ .SiteURL }} {{ .Email }}
  Layout con tablas + estilos inline a propósito: la mayoría de clientes de correo
  (Outlook, Gmail) ignoran flexbox/grid/CSS externo.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0d13;padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background-color:#171c28;border:1px solid #2b3446;border-radius:12px;overflow:hidden;">

        <!-- Header -->
        <tr>
          <td align="center" style="background-color:#0a0d13;padding:28px 24px;border-bottom:1px solid #2b3446;">
            <span style="font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:bold;letter-spacing:2px;color:#c9a24b;text-transform:uppercase;">
              ⚔ Dofus Forge
            </span>
          </td>
        </tr>

        <!-- Body -->
        <tr>
          <td style="padding:32px 28px;font-family:Arial,Helvetica,sans-serif;">
            <h1 style="margin:0 0 12px;font-size:19px;color:#e9e5da;">Confirm it's you</h1>
            <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#9aa0b0;">
              You're about to perform a sensitive action on your Dofus Forge account. Enter this code to confirm it's really you:
            </p>

            <p style="margin:0 0 24px;font-size:30px;font-weight:bold;letter-spacing:6px;color:#c9a24b;font-family:'Courier New',monospace;text-align:center;">
              {{ .Token }}
            </p>

            <p style="margin:0;font-size:12px;line-height:1.6;color:#7a849c;">
              If this wasn't you, consider changing your password.
            </p>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td align="center" style="padding:16px 24px;background-color:#0a0d13;border-top:1px solid #2b3446;">
            <span style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#7a849c;">
              Dofus Forge — build planner for Dofus 3
            </span>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
