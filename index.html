<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />

    <!--
      Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
      Decodes the path that 404.html re-encoded into a query string, restoring
      the real URL (e.g. /dofus-forge/es/) via history.replaceState before
      React Router reads location. Must run before the app's module script.
    -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          )
        }
      }(window.location))
    </script>

    <!--
      Legacy build-link compatibility: old shared URLs used HashRouter,
      e.g. /dofus-forge/#/?b=<encoded>. Since the hash fragment is never
      sent to the server, this must be resolved client-side by rewriting
      it into a real path + query string before React Router mounts.
    -->
    <script>
      (function(l) {
        if (l.hash.indexOf('#/') === 0) {
          var afterHash = l.hash.slice(2)          // "?b=xxxx" or ""
          var qIndex    = afterHash.indexOf('?')
          var query     = qIndex === -1 ? '' : afterHash.slice(qIndex)
          window.history.replaceState(null, null, l.pathname + (query || l.search))
        }
      }(window.location))
    </script>

    <!-- Primary SEO -->
    <title>Dofus Forge — Build Planner for Dofus 3</title>
    <meta name="description" content="Plan your Dofus 3 builds online — item catalog, set bonuses, magesmithy runes, stat optimizer, and shareable build URLs. Free, fast, always up to date." />
    <meta name="keywords" content="dofus forge, dofus build planner, dofus 3, planificador builds dofus, dofus optimizer, dofus sets, dofus equipment, dofus stats, dofus runas, dofus forja" />
    <meta name="author" content="Wembie" />
    <link rel="canonical" href="https://wembie.github.io/dofus-forge/" />

    <!-- Language alternates — updated per-route by useSeoMeta.ts, this is the crawler-visible baseline -->
    <link rel="alternate" hreflang="en"        href="https://wembie.github.io/dofus-forge/" />
    <link rel="alternate" hreflang="es"        href="https://wembie.github.io/dofus-forge/es/" />
    <link rel="alternate" hreflang="fr"        href="https://wembie.github.io/dofus-forge/fr/" />
    <link rel="alternate" hreflang="pt"        href="https://wembie.github.io/dofus-forge/pt/" />
    <link rel="alternate" hreflang="x-default" href="https://wembie.github.io/dofus-forge/" />

    <!-- Open Graph (Facebook, Discord, WhatsApp previews) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://wembie.github.io/dofus-forge/" />
    <meta property="og:title"       content="Dofus Forge — Build Planner for Dofus 3" />
    <meta property="og:description" content="Plan your Dofus 3 builds — item catalog, set bonuses, magesmithy runes, stat optimizer, and shareable build URLs." />
    <meta property="og:image"       content="https://wembie.github.io/dofus-forge/og-preview.png" />
    <meta property="og:locale"      content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name"   content="Dofus Forge" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Dofus Forge — Build Planner for Dofus 3" />
    <meta name="twitter:description" content="Plan your Dofus 3 builds — item catalog, set bonuses, magesmithy runes, stat optimizer, and shareable build URLs." />
    <meta name="twitter:image"       content="https://wembie.github.io/dofus-forge/og-preview.png" />

    <!-- Schema.org structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Dofus Forge",
      "alternateName": "dofus-forge",
      "description": "Build planner for Dofus 3 — item catalog, set bonuses, magesmithy runes, stat optimizer, and shareable build URLs.",
      "url": "https://wembie.github.io/dofus-forge/",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web Browser",
      "inLanguage": ["es", "en", "fr", "pt"],
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Wembie"
      },
      "about": {
        "@type": "VideoGame",
        "name": "Dofus",
        "gamePlatform": "PC"
      }
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/dofus-forge/favicon.svg" />
    <meta name="theme-color" content="#0d0f14" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Fonts loaded non-render-blocking: discovered immediately (unlike a
      CSS @import buried inside the bundled stylesheet), fetched as
      media="print" so it never blocks first paint, then swapped to "all"
      once loaded. noscript fallback covers JS-disabled clients.
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" />
    </noscript>

    <!-- Block flash of wrong theme before React mounts -->
    <script>
      (function() {
        var t = localStorage.getItem('dofus-forge-theme');
        var prefer = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var theme = (t === 'light' || t === 'dark') ? t : prefer;
        document.documentElement.classList.add(theme === 'light' ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
