<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dofus-forge/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Dofus Forge — unofficial Dofus build planner. Pick class, equip gear, allocate stats, share builds." />
    <meta name="theme-color" content="#0d0f14" />

    <!-- Preconnect to Google Fonts for faster load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Block flash of wrong theme before React mounts -->
    <script>
      (function() {
        var t = localStorage.getItem('dofus-forge-theme');
        var prefer = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var theme = (t === 'light' || t === 'dark') ? t : prefer;
        document.documentElement.classList.add(theme === 'light' ? 'light' : 'dark');
      })();
    </script>

    <title>Dofus Forge</title>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
