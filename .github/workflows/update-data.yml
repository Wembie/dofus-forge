name: Update Game Data

on:
  schedule:
    # Every hour — fetch-data.ts checks the lightweight /meta/version endpoint
    # first and exits immediately if the game version hasn't changed, so this
    # stays cheap; it only does the full item/set/spell/image fetch once Dofus
    # actually ships an update, instead of waiting up to a week to notice.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force refresh even if game version unchanged'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch game data
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          pnpm fetch-data $ARGS
          pnpm fetch-spells $ARGS
          pnpm fetch-images $ARGS

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit data update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          VERSION=$(node -e "console.log(require('./public/data/version.json').gameVersion)")
          git commit -m "chore(data): update game data to $VERSION"
          git push
