name: PR Checks

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Docs-only PRs skip build/lint/test and the dependency audit. Secret
  # scanning and CodeQL still run on them: a Markdown file can leak a token
  # too, and the code-scanning rule needs a CodeQL result on every PR.
  # Skipping at job level (not with on.pull_request.paths-ignore) keeps
  # required status checks green: a skipped job reports success, a workflow
  # that never starts leaves the check pending forever.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE...$HEAD" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docs-only change (Markdown, docs/, LICENSE): skipping build and test jobs"
          fi

  # ── Build, lint, type-check, tests ───────────────────────────────────
  validate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Validate release version consistency
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const releaseVersion = readFileSync('VERSION', 'utf8').trim();

          if (packageVersion !== releaseVersion) {
            console.error(`Version mismatch: package.json=${packageVersion}, VERSION=${releaseVersion}`);
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsc -b (strict type check) + vite build — no Supabase secrets needed:
      # missing VITE_SUPABASE_* only warns at runtime, never fails the build.
      - name: Type check + build
        run: pnpm build

      # JS/CSS each key page loads up front (brotli), against fixed budgets.
      - name: Page weight budget
        run: node scripts/check-budget.mjs

      # Bundles the Worker exactly as a deploy would (fonts, wasm, bindings)
      # without uploading anything; needs no Cloudflare credentials.
      - name: Worker bundle (dry run)
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.153.0 deploy --dry-run --outdir "$RUNNER_TEMP/worker-bundle"

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test --run

  # ── Security ──────────────────────────────────────────────────────────
  security:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # gitleaks needs full history to scan the PR's commit range
          persist-credentials: false

      - name: Check PR diff for whitespace errors and conflict markers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE...$HEAD"

      # Fails fast, cheap, and specific to this repo: .env holds real
      # Supabase credentials locally and must never be committed.
      - name: .env must never be committed
        run: |
          if git ls-files | grep -qx '\.env'; then
            echo "::error::.env is tracked in git — remove it and rotate any exposed keys immediately."
            exit 1
          fi

      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        if: needs.changes.outputs.code == 'true'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      # High/critical only — moderate/low in transitive deps with no fix
      # available yet would otherwise block every PR on noise.
      #
      # --ignore-unfixable: e.g. GHSA-vfj7-8cjw-p6xm (braces, pulled in via
      # tailwindcss's chokidar/fast-glob/micromatch — a build-time-only glob
      # dependency, never shipped in the production bundle). The advisory
      # lists a "patched" version (3.0.4) that doesn't actually exist on the
      # npm registry yet — `pnpm update` can't reach it, so without this
      # flag CI stays permanently red until upstream publishes a real fix.
      # This flag only skips vulnerabilities with no installable fix right
      # now; it starts failing again the moment one becomes available.
      - name: Dependency audit (high/critical)
        if: needs.changes.outputs.code == 'true'
        run: pnpm audit --audit-level=high --ignore-unfixable

  # Fails a PR that adds or upgrades to a dependency with a known high or
  # critical advisory (pnpm audit above checks the whole tree instead).
  dependency-review:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  # CodeQL (required check "codeql") lives in codeql.yml: the same job must
  # also run on pushes to main for the code-scanning rule to compare them.
