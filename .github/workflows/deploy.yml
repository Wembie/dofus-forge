# Site moved to Cloudflare Worker (wrangler.jsonc), custom domain
# dofusforge.com, 2026-10. GH Pages no longer serves the real app — it
# now just redirects old github.io links to the new domain, preserving
# path/query/hash (scripts/gh-pages-redirect.html).
#
# To restore the full GH Pages build instead of the redirect, swap the
# "Prepare redirect page" step back for the old pnpm install/build +
# upload-pages-artifact(path: dist) steps, and revert vite.config.ts
# base path default to '/dofus-forge/'.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The redirect page doesn't change with documentation.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare redirect page
        run: |
          mkdir -p redirect-dist
          cp scripts/gh-pages-redirect.html redirect-dist/index.html
          cp scripts/gh-pages-redirect.html redirect-dist/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: redirect-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
