name: Database

# Runs supabase/tests/database (pgTAP: cross-user isolation, RLS, server-owned
# columns) against a throwaway local Supabase stack built from
# supabase/schema.sql. Never touches the hosted project; needs no secrets.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'supabase/**'
      - '.github/workflows/database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rls-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.0

      # supabase/migrations are incremental and assume the base schema already
      # exists; a fresh database is built from the cumulative schema.sql.
      - name: Start local Supabase
        run: |
          mv supabase/migrations "$RUNNER_TEMP/migrations"
          supabase init < /dev/null
          # Isolate this run from other local stacks and occupied default ports.
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import socket
          import tomllib

          path = pathlib.Path('supabase/config.toml')
          config = path.read_text()
          original = tomllib.loads(config)
          project = f"dofus-forge-ci-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          config, count = re.subn(r'(?m)^project_id\s*=.*$', f'project_id = "{project}"', config)
          assert count == 1
          sockets = []
          try:
              ports = {}
              for section, key in [('api', 'port'), ('db', 'port'), ('db', 'shadow_port')]:
                  listener = socket.socket()
                  listener.bind(('0.0.0.0', 0))
                  sockets.append(listener)
                  port = listener.getsockname()[1]
                  pattern = rf'(?m)^{key}\s*=\s*{original[section][key]}\s*$'
                  config, count = re.subn(pattern, f'{key} = {port}', config)
                  assert count == 1, f'Expected one {section}.{key} setting'
                  ports[section, key] = port
              configured = tomllib.loads(config)
              for (section, key), port in ports.items():
                  assert configured[section][key] == port
              path.write_text(config)
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write(f"DB_URL=postgresql://postgres:postgres@127.0.0.1:{ports['db', 'port']}/postgres\n")
          finally:
              for listener in sockets:
                  listener.close()
          PY
          # pgTAP does not send email; no mail UI needs to bind a host port.
          supabase start -x studio,mailpit,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor

      - name: Load schema
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
