name: CodeQL

# One job for pull requests AND the branches themselves. GitHub identifies a
# code-scanning configuration by workflow + job + category, and the "code
# scanning" rule on main compares a PR's configurations with main's, so both
# must come from this same job; an analysis that only ran on PRs (or a
# separate baseline job) never matches and the rule waits forever
# ("configuration not found"). This job is the required check "codeql".
# It runs on docs-only changes too: the rule needs a result on every PR.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    - cron: '0 5 * * 1'   # weekly: new CodeQL queries without waiting for a PR
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
