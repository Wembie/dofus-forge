name: Cloudflare preview

# A preview for one PR, only when the owner asks for it: Actions → "Cloudflare
# preview" → Run workflow → PR number. Nothing runs on its own (no push or PR
# trigger), and only users with write access can start a manual run.
# Replaces Cloudflare Workers Builds' automatic branch previews (turned off in
# the dashboard), which built and uploaded on every push. Setup:
# docs/security/CLOUDFLARE_HARDENING.md ("PR previews").
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Repository secrets CLOUDFLARE_PREVIEW_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set."
            exit 1
          fi

      # Only open PRs from this repository: a fork's code never runs with the token.
      - name: Resolve the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          state=$(jq -r '.state' <<< "$pr")
          head_repo=$(jq -r '.head.repo.full_name // empty' <<< "$pr")
          if [ "$state" != "open" ]; then
            echo "::error::PR #${PR_NUMBER} is ${state}."
            exit 1
          fi
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR #${PR_NUMBER} comes from ${head_repo:-a deleted fork}; previews only build branches of this repository."
            exit 1
          fi
          echo "sha=$(jq -r '.head.sha' <<< "$pr")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ steps.pr.outputs.sha }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same public client settings the production build gets from Cloudflare.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build

      # Uploads a version without deploying it: production keeps serving the
      # current deployment. The alias gives the PR one stable URL.
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          PR_NUMBER: ${{ inputs.pr }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          pnpm exec wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} ${HEAD_SHA:0:7}" | tee "$RUNNER_TEMP/upload.log"
          alias_url=$(grep -oE 'https://pr-[0-9]+-dofus-forge\.[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/upload.log" | head -1 || true)
          version_url=$(grep -oE 'https://[A-Za-z0-9-]+-dofus-forge\.[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/upload.log" | grep -v '://pr-' | head -1 || true)
          url="${alias_url:-$version_url}"
          if [ -z "$url" ]; then
            echo "::error::wrangler did not print a preview URL."
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "version_url=${version_url}" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          URL: ${{ steps.upload.outputs.url }}
          VERSION_URL: ${{ steps.upload.outputs.version_url }}
        run: |
          set -euo pipefail
          marker='<!-- cloudflare-preview -->'
          body=$(printf '%s\n**Cloudflare preview** for `%s`: %s\n\nThis commit only: %s\n' \
            "$marker" "${HEAD_SHA:0:7}" "$URL" "${VERSION_URL:-—}")
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\")))][0].id // empty" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi
