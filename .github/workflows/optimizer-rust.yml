name: Rust optimizer

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: optimizer-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-optimizer

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - name: Run Clippy
        working-directory: rust-optimizer
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: rust-optimizer
        run: cargo test --locked

      - name: Rebuild the WASM distribution
        working-directory: rust-optimizer
        run: wasm-pack build . --target web --release --out-dir "$RUNNER_TEMP/wasm-generated" --no-pack --locked

      - name: Verify generated WASM bindings match the committed interface
        run: |
          set -euo pipefail
          for file in dofus_forge_optimizer.js dofus_forge_optimizer.d.ts dofus_forge_optimizer_bg.wasm.d.ts; do
            cmp "public/wasm/${file}" "${RUNNER_TEMP}/wasm-generated/${file}"
          done

      - name: Require a checked-in WASM update when optimizer inputs change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git diff --quiet "${BASE_SHA}...HEAD" -- rust-optimizer; then
            if git diff --quiet "${BASE_SHA}...HEAD" -- public/wasm/dofus_forge_optimizer_bg.wasm; then
              echo "::error::Rust optimizer sources changed without updating the checked-in WASM binary."
              exit 1
            fi
          fi
