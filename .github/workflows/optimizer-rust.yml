name: Rust optimizer

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: optimizer-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-optimizer

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - name: Run Clippy
        working-directory: rust-optimizer
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: rust-optimizer
        run: cargo test --locked

      - name: Rebuild the checked-in WASM distribution
        working-directory: rust-optimizer
        run: wasm-pack build . --target web --release --out-dir ../public/wasm --no-pack --locked

      - name: Verify committed WASM artifacts are up to date
        run: git diff --exit-code -- public/wasm
