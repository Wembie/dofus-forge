name: Create Release

on:
  push:
    branches: [main]
    paths:
      - VERSION   # only fires when a new version lands on main
  workflow_dispatch:

permissions:
  contents: write  # required to create tags and releases

concurrency:
  group: create-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Step outputs reach later scripts through env, never as ${{ }} text
      # spliced into a script, and the version must look like one first.
      - name: Read version
        id: ver
        run: |
          NUM="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$NUM" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be MAJOR.MINOR.PATCH, got '$NUM'"
            exit 1
          fi
          echo "tag=v$NUM" >> "$GITHUB_OUTPUT"
          echo "num=$NUM" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare English X post draft
        if: steps.tag_check.outputs.exists == 'false' || github.run_attempt > 1 || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.num }}
        run: node scripts/prepare-x-post.mjs

      - name: Extract changelog for this version
        if: steps.tag_check.outputs.exists == 'false' || github.run_attempt > 1
        env:
          VER: ${{ steps.ver.outputs.num }}
        run: |
          python3 - <<'PYEOF' > release_notes.txt
          import os, sys
          content = open('docs/CHANGELOG.md', encoding='utf-8').read()
          marker = f"## [{os.environ['VER']}]"
          start = content.find(marker)
          if start == -1:
              print('No changelog entry found.')
              sys.exit(0)
          start = content.find('\n', start) + 1
          end = content.find('\n## [', start)
          if end == -1:
              end = len(content)
          print(content[start:end].strip())
          PYEOF

      # gh ships with the runner, so no third-party action holds the
      # contents: write token. The notes go in as a file, never as text.
      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "Dofus Forge $TAG" --notes-file release_notes.txt

      # Discord's own GitHub webhook integration (the one using the /github
      # URL suffix) only shows a bare one-line "new release published"
      # message for release events — no changelog content, regardless of
      # what's in the release body above. Posting our own embed instead
      # gives full control over what shows up.
      - name: Post release notes to Discord
        if: steps.tag_check.outputs.exists == 'false'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TITLE: "🔨 Dofus Forge ${{ steps.ver.outputs.tag }}"
          RELEASE_URL: "https://github.com/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}"
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No DISCORD_WEBHOOK_URL secret set — skipping Discord notification."
            exit 0
          fi
          # release_notes.txt (from the previous step) is read via --rawfile,
          # never interpolated into this script as text — the changelog body
          # is arbitrary markdown and can contain backticks, quotes, etc.;
          # splicing it into a shell string via a workflow template expression
          # let bash interpret those as command substitution and broke the
          # whole script (e.g. a backtick-wrapped path ran as a command).
          jq -n \
            --arg title "$RELEASE_TITLE" \
            --rawfile desc release_notes.txt \
            --arg url "$RELEASE_URL" \
            '{embeds: [{title: $title, description: $desc, url: $url, color: 13148498}]}' \
            > payload.json
          curl -sf -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK_URL"
