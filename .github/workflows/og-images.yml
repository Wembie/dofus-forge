name: Share images

# Renders every set and class share card (4 languages) into the private OG
# bucket ahead of time (scripts/og-pregenerate.ts), so the Worker serves them
# instead of rendering: a render takes 0.3–1.4 s of CPU, against the Workers
# Free plan's 10 ms per request. Build cards are stored by the Worker itself.
#
# Incremental: each card's content is hashed and only cards whose hash
# changed are rendered (a game patch touching ten sets renders ten cards; a
# template change renders all). A run with nothing to do takes seconds.
# update-data.yml dispatches it right after committing new game data; the
# schedule is the safety net, the push trigger catches card code merged into
# main.
on:
  schedule:
    - cron: '40 */6 * * *'
  push:
    branches: [main]
    paths:
      - public/data/version.json
      - public/locales/*/translation.json
      - src/worker/ogRender.ts
      - src/worker/ogPages.ts
      - src/worker/ogImage.ts
      - src/worker/fonts/**
      - scripts/og-pregenerate.ts
  workflow_dispatch:
    inputs:
      force:
        description: Re-render and re-upload every card, changed or not
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: og-images
  cancel-in-progress: false

jobs:
  pregenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FORCE: ${{ inputs.force && '--force' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rasterizing is CPU-bound: one shard per core, each with its own
      # manifest of stored hashes. A failed card is retried on the next run.
      - name: Render and store set and class cards
        run: |
          set -euo pipefail
          pids=()
          for shard in 0 1 2 3; do
            # shellcheck disable=SC2086
            pnpm -s og:pregenerate --shard "${shard}/4" $FORCE > "$RUNNER_TEMP/shard-${shard}.log" 2>&1 &
            pids+=("$!")
          done
          status=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then status=1; fi
            echo "::group::shard ${i}/4"; cat "$RUNNER_TEMP/shard-${i}.log"; echo "::endgroup::"
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::At least one shard failed; its other cards are stored and the next run retries the rest."
            exit 1
          fi
