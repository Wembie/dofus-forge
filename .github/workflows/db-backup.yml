name: Database Backup

# Nightly pg_dump of the Supabase database into a PRIVATE R2 bucket. The free
# Supabase plan keeps no downloadable backups. The dump holds account emails,
# so it never goes into the repo or a workflow artifact (both are public).
# Restore: docs/DATABASE.md → "Backups".
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      # Session pooler URI (Supabase → Connect → Session pooler): the direct
      # connection is IPv6-only and GitHub runners have no IPv6.
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: dofus-forge-backups
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DB_URL" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::SUPABASE_DB_URL / CLOUDFLARE_API_TOKEN not set, skipping backup"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [[ "$DB_URL" == *"@db."*".supabase.co"* ]]; then
            echo "::error::SUPABASE_DB_URL is the Direct connection (IPv6 only, unreachable from GitHub runners). Use Supabase → Connect → Session pooler (host *.pooler.supabase.com, user postgres.<project-ref>)."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # pg_dump must be at least the server's major version, so install the
      # client matching whatever Postgres version Supabase runs.
      - name: Install matching pg_dump
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # A secret pasted with a trailing newline made psql look for the
          # database "postgres\n"; a connection URI never contains whitespace.
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '[:space:]')"
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          SERVER_NUM=$(psql "$DB_URL" -tAc 'show server_version_num')
          MAJOR=$((SERVER_NUM / 10000))
          sudo apt-get install -y -qq "postgresql-client-$MAJOR" > /dev/null
          echo "PG_BIN=/usr/lib/postgresql/$MAJOR/bin" >> "$GITHUB_ENV"
          echo "Server major version: $MAJOR"

      - name: Dump
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # A secret pasted with a trailing newline made psql look for the
          # database "postgres\n"; a connection URI never contains whitespace.
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '[:space:]')"
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          echo "FILE=db-$STAMP.dump" >> "$GITHUB_ENV"
          # public = app data, auth = accounts (needed to restore logins),
          # storage = avatar object metadata (the files live in the bucket).
          "$PG_BIN/pg_dump" "$DB_URL" --format=custom --compress=9 \
            --schema=public --schema=auth --schema=storage \
            --no-owner --no-privileges --file="db-$STAMP.dump"
          "$PG_BIN/pg_restore" --list "db-$STAMP.dump" > /dev/null
          ls -lh "db-$STAMP.dump"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22

      # Tells a wrong secret (an S3 Access Key / Secret pasted instead of the
      # token value) from a token that is valid but lacks R2 access, instead of
      # a bare 401 from wrangler. User tokens and account tokens are verified on
      # different endpoints.
      - name: Check Cloudflare token
        if: steps.config.outputs.ready == 'true'
        run: |
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if curl -sS "${auth[@]}" https://api.cloudflare.com/client/v4/user/tokens/verify | grep -q '"status":"active"'; then
            echo "User API token: active"
          elif curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | grep -q '"status":"active"'; then
            echo "Account API token: active"
          else
            echo "::error::CLOUDFLARE_API_TOKEN is not an active API token of account CLOUDFLARE_ACCOUNT_ID. Paste the token value (not the S3 Access Key ID / Secret Access Key) and check CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Upload to R2
        if: steps.config.outputs.ready == 'true'
        run: |
          if ! npx --yes wrangler@4.153.0 r2 object put "$BUCKET/db/$FILE" --file "$FILE" --content-type application/octet-stream --remote; then
            echo "::error::Upload refused. The token needs write access to $BUCKET: an R2 token with Object Read & Write on it (or on all buckets), or an API token with 'Workers R2 Storage: Edit'."
            exit 1
          fi
