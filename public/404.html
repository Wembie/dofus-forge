<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Dofus Forge</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: #0a0d13;
        font-family: 'Inter', system-ui, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 32px;
        text-align: center;
      }
      .emblem {
        width: 64px;
        height: 64px;
        opacity: 0.92;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.97); }
        50%      { opacity: 1;    transform: scale(1); }
      }
      .brand {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.02em;
        color: #eccb78;
      }
      .status {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #9aa0b0;
      }
      .fallback {
        margin-top: 6px;
        font-size: 13px;
        color: #626a7d;
      }
      .fallback a {
        color: #c9a24b;
        text-decoration: none;
        border-bottom: 1px solid rgba(201,162,75,0.4);
      }
      .fallback a:hover { border-bottom-color: #c9a24b; }
      noscript .fallback { margin-top: 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- brand:emblem --><svg class="emblem" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t"><title id="t">Dofus Forge</title><defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f8e3a3" /><stop offset=".32" stop-color="#eccb78" />
    <stop offset=".72" stop-color="#c9a24b" /><stop offset="1" stop-color="#9b7a33" />
  </linearGradient>
  <linearGradient id="goldShade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b8923f" /><stop offset="1" stop-color="#6b5220" />
  </linearGradient>
  <radialGradient id="tile" cx="50%" cy="34%" r="80%">
    <stop offset="0" stop-color="#1d2334" /><stop offset=".6" stop-color="#11151e" /><stop offset="1" stop-color="#0a0d13" />
  </radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#c9a24b" stop-opacity=".34" /><stop offset=".55" stop-color="#c9a24b" stop-opacity=".08" />
    <stop offset="1" stop-color="#c9a24b" stop-opacity="0" />
  </radialGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eccb78" /><stop offset=".5" stop-color="#c9a24b" /><stop offset="1" stop-color="#7f6428" />
  </linearGradient>
</defs><rect width="512" height="512" rx="112" fill="url(#tile)" /><rect width="512" height="512" rx="112" fill="url(#glow)" opacity=".9" /><rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="url(#hair)" stroke-width="6" opacity=".9" /><g transform="translate(87.04 87.04) scale(0.66)"><clipPath id="ecs"><path fill-rule="evenodd" d="M256 24 C348.79 24 424 144.49 424 293.12 C424 400.75 348.79 488 256 488 C163.21 488 88 400.75 88 293.12 C88 144.49 163.21 24 256 24 Z M150 318 L362 318 L362 344 L334 344 L310 364 L310 382 L342 404 L342 420 L170 420 L170 404 L202 382 L202 364 L178 344 L168 344 Q150 340 132 318 L150 318 Z M256 198 L278 236 L256 274 L234 236 Z" /></clipPath><path fill-rule="evenodd" d="M256 24 C348.79 24 424 144.49 424 293.12 C424 400.75 348.79 488 256 488 C163.21 488 88 400.75 88 293.12 C88 144.49 163.21 24 256 24 Z M150 318 L362 318 L362 344 L334 344 L310 364 L310 382 L342 404 L342 420 L170 420 L170 404 L202 382 L202 364 L178 344 L168 344 Q150 340 132 318 L150 318 Z M256 198 L278 236 L256 274 L234 236 Z" fill="url(#gold)" /><g clip-path="url(#ecs)"><path d="M289.6 22 C390.4 163.2 373.6 395.2 259.36 490 L474.4 490 L474.4 22 Z" fill="url(#goldShade)" opacity=".92" /><path d="M124.96 256 C121.6 153.92 163.6 70.4 225.76 47.2" fill="none" stroke="#fff6dc" stroke-width="11.76" stroke-linecap="round" opacity=".75" /></g></g></svg><!-- /brand:emblem -->
      <div class="brand">Dofus Forge</div>
      <div class="status">Redirecting…</div>
      <p class="fallback" id="stuck-fallback" style="display: none;">
        Taking too long?
        <a href="/">Go to Dofus Forge →</a>
      </p>
      <noscript>
        <p class="fallback">
          JavaScript is required.
          <a href="/">Go to Dofus Forge →</a>
        </p>
      </noscript>
    </div>

    <script>
      // Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrites, so a deep link like
      // /dofus-forge/es/ 404s on direct load (e.g. a search engine crawler,
      // or a user refreshing the page). This encodes the real path into a
      // query string and redirects to index.html, which decodes it back
      // via history.replaceState before the app mounts (see index.html).
      //
      // l.replace() below should navigate away immediately, but a user
      // reported getting stuck on this exact screen after a deploy (likely
      // a cached copy of this file, or of the index.html it redirects to,
      // misbehaving) with no way out except manually typing a URL. This
      // timer is a visible escape hatch: if the redirect hasn't already
      // navigated away within 2.5s, show a manual link instead of leaving
      // the user staring at "Redirecting…" indefinitely.
      setTimeout(function () {
        var el = document.getElementById('stuck-fallback');
        if (el) el.style.display = 'block';
      }, 2500);

      var pathSegmentsToKeep = 1; // keeps "/dofus-forge"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </body>
</html>
