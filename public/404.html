<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Dofus Forge</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: #0a0d13;
        font-family: 'Inter', system-ui, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 32px;
        text-align: center;
      }
      .emblem {
        width: 64px;
        height: 64px;
        opacity: 0.92;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.97); }
        50%      { opacity: 1;    transform: scale(1); }
      }
      .brand {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.02em;
        color: #eccb78;
      }
      .status {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #9aa0b0;
      }
      .fallback {
        margin-top: 6px;
        font-size: 13px;
        color: #626a7d;
      }
      .fallback a {
        color: #c9a24b;
        text-decoration: none;
        border-bottom: 1px solid rgba(201,162,75,0.4);
      }
      .fallback a:hover { border-bottom-color: #c9a24b; }
      noscript .fallback { margin-top: 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- brand:emblem --><svg class="emblem" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t"><title id="t">Dofus Forge</title><defs>
  </defs><defs>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff4cf" /><stop offset=".16" stop-color="#f3d68c" /><stop offset=".42" stop-color="#d9b25c" />
    <stop offset=".58" stop-color="#a77d32" /><stop offset=".7" stop-color="#c9a24b" /><stop offset=".84" stop-color="#e8c977" />
    <stop offset="1" stop-color="#8d6a26" />
  </linearGradient>
  <radialGradient id="metalSide" cx="34%" cy="30%" r="78%">
    <stop offset="0" stop-color="#3b2a0c" stop-opacity="0" /><stop offset=".62" stop-color="#3b2a0c" stop-opacity="0" />
    <stop offset="1" stop-color="#2a1d07" stop-opacity=".62" />
  </radialGradient>
  <radialGradient id="tile2" cx="50%" cy="30%" r="85%">
    <stop offset="0" stop-color="#222a3d" /><stop offset=".55" stop-color="#121722" /><stop offset="1" stop-color="#06080d" />
  </radialGradient>
  <radialGradient id="floor" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#e65f40" stop-opacity=".38" /><stop offset=".5" stop-color="#c9a24b" stop-opacity=".12" />
    <stop offset="1" stop-color="#c9a24b" stop-opacity="0" />
  </radialGradient>
  <radialGradient id="aura" cx="50%" cy="46%" r="50%">
    <stop offset="0" stop-color="#eccb78" stop-opacity=".26" /><stop offset=".6" stop-color="#c9a24b" stop-opacity=".06" />
    <stop offset="1" stop-color="#c9a24b" stop-opacity="0" />
  </radialGradient>
  </defs><rect width="512" height="512" rx="112" fill="url(#tile2)" /><rect width="512" height="512" rx="112" fill="url(#aura)" /><ellipse cx="256" cy="462.95" rx="270.61" ry="85.45" fill="url(#floor)" /><g transform="translate(15.36 15.36) scale(0.94)"><clipPath id="gs"><path d="M256 22 C346.58 22 420 142.49 420 291.12 C420 398.75 346.58 486 256 486 C165.42 486 92 398.75 92 291.12 C92 142.49 165.42 22 256 22 Z" /></clipPath><path d="M256 22 C346.58 22 420 142.49 420 291.12 C420 398.75 346.58 486 256 486 C165.42 486 92 398.75 92 291.12 C92 142.49 165.42 22 256 22 Z" fill="url(#metal)" /><g clip-path="url(#gs)"><path d="M256 22 C346.58 22 420 142.49 420 291.12 C420 398.75 346.58 486 256 486 C165.42 486 92 398.75 92 291.12 C92 142.49 165.42 22 256 22 Z" fill="url(#metalSide)" /></g><path d="M120 330 C150 326 178 325 200 325 L358 325 Q364 325 364 331 L364 344 Q364 350 358 350 L338 350 C320 352 308 362 306 378 L306 386 C308 397 320 403 338 405 Q344 406 344 412 L344 418 Q344 424 338 424 L174 424 Q168 424 168 418 L168 412 Q168 406 174 405 C192 403 204 397 206 386 L206 378 C204 363 194 353 176 351 L172 351 C150 351 132 344 120 330 Z" transform="translate(256 374) scale(1.18) translate(-238 -369)" fill="#1a0c06" /><path d="M256 160 L290 222 L256 284 L222 222 Z" fill="#1a0c06" /><path d="M256 192 L273 224 L256 256 L239 224 Z" fill="#ffd27a" /></g></svg><!-- /brand:emblem -->
      <div class="brand">Dofus Forge</div>
      <div class="status">Redirecting…</div>
      <p class="fallback" id="stuck-fallback" style="display: none;">
        Taking too long?
        <a href="/">Go to Dofus Forge →</a>
      </p>
      <noscript>
        <p class="fallback">
          JavaScript is required.
          <a href="/">Go to Dofus Forge →</a>
        </p>
      </noscript>
    </div>

    <script>
      // Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrites, so a deep link like
      // /dofus-forge/es/ 404s on direct load (e.g. a search engine crawler,
      // or a user refreshing the page). This encodes the real path into a
      // query string and redirects to index.html, which decodes it back
      // via history.replaceState before the app mounts (see index.html).
      //
      // l.replace() below should navigate away immediately, but a user
      // reported getting stuck on this exact screen after a deploy (likely
      // a cached copy of this file, or of the index.html it redirects to,
      // misbehaving) with no way out except manually typing a URL. This
      // timer is a visible escape hatch: if the redirect hasn't already
      // navigated away within 2.5s, show a manual link instead of leaving
      // the user staring at "Redirecting…" indefinitely.
      setTimeout(function () {
        var el = document.getElementById('stuck-fallback');
        if (el) el.style.display = 'block';
      }, 2500);

      var pathSegmentsToKeep = 1; // keeps "/dofus-forge"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </body>
</html>
