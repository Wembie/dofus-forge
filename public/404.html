      }

      .emblem {
        width: 64px;

      }

        letter-spacing: 0.02em;

      .status {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #9aa0b0;
      }
      .fallback {
        margin-top: 6px;
        font-size: 13px;
        color: #626a7d;
      }
      .fallback a {
        color: #c9a24b;
        text-decoration: none;
        border-bottom: 1px solid rgba(201,162,75,0.4);
      }
      .fallback a:hover { border-bottom-color: #c9a24b; }
      noscript .fallback { margin-top: 0; }

    <script>
      // Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrites, so a deep link like
      // /dofus-forge/es/ 404s on direct load (e.g. a search engine crawler,
      // or a user refreshing the page). This encodes the real path into a
      // query string and redirects to index.html, which decodes it back
      // via history.replaceState before the app mounts (see index.html).
      //
      // l.replace() below should navigate away immediately, but a user
      // reported getting stuck on this exact screen after a deploy (likely
      // a cached copy of this file, or of the index.html it redirects to,
      // misbehaving) with no way out except manually typing a URL. This
      // timer is a visible escape hatch: if the redirect hasn't already
      // navigated away within 2.5s, show a manual link instead of leaving
      // the user staring at "Redirecting…" indefinitely.
      setTimeout(function () {
        var el = document.getElementById('stuck-fallback');
        if (el) el.style.display = 'block';
      }, 2500);

      var pathSegmentsToKeep = 1; // keeps "/dofus-forge"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
