packages: []

allowBuilds:
  esbuild: true
  workerd: true

# Transitive dev-only deps (eslint's own chain) with known high-severity
# advisories — same-major patch bumps, never shipped to the browser bundle.
overrides:
  brace-expansion@<2.0.0: ^1.1.20
  brace-expansion@>=4.0.0: ^5.0.12
  nanoid: ^3.3.18
  js-yaml: ^4.3.2
  # Same-major patch bumps for advisories (M150 audit): tailwindcss's postcss
  # chain (build time), eslint-plugin-react-hooks' zod (lint), satori's font
  # parser (Worker OG images; it only ever reads our own bundled fonts).
  postcss-selector-parser@6: ^6.1.5
  source-map-js: ^1.2.2
  zod@4: ^4.6.6
  fflate@0.7: ^0.7.5
